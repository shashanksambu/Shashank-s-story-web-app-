<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="StoryWeave – read unlimited stories.">
<meta name="theme-color" content="#0f131a">
<title>StoryWeave – Read Unlimited Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f131a;
  --surface:#19202c;
  --surface-2:#212a39;
  --sidebar:#0d1118;
  --line:rgba(255,255,255,.075);
  --accent:#18a1a1;
  --accent-hi:#4fd6d6;
  --text:#e7ecf4;
  --muted:#8a96a8;
  --ok:#3fbf8a;
  --danger:#ff8a8a;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --read-size:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:400 14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor;stroke:none}
*{scrollbar-width:thin;scrollbar-color:#2c3646 transparent}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;min-height:60px;padding:0 20px 0 0;background:rgba(15,19,26,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;width:184px;padding-left:18px;flex:none;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#fff}
.brand svg{width:36px;height:31px;filter:drop-shadow(0 0 7px rgba(60,220,220,.6))}
.nav{display:flex;gap:2px;height:60px}
.nav button{position:relative;padding:0 14px;color:#c1cbd9;font-weight:500}
.nav button:hover{color:#fff}
.nav button[aria-current=page]{color:var(--accent-hi)}
.nav button[aria-current=page]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--accent-hi)}
.grow{flex:1}
.search{position:relative;width:min(330px,30vw)}
.search svg{position:absolute;left:13px;top:11px;font-size:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;padding:0 14px 0 38px;border-radius:10px;background:#1a212d;border:1px solid var(--line)}
.search input::placeholder{color:#7f8b9d}
.search input:focus{outline:none;border-color:rgba(79,214,214,.55);box-shadow:0 0 0 3px rgba(24,161,161,.18)}
.actions{position:relative;display:flex;align-items:center;gap:10px;margin-left:6px}
.icon-btn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;font-size:19px;color:#c1cbd9}
.icon-btn:hover{background:#1a212d;color:#fff}
.icon-btn.dot::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff5a5a;border:2px solid var(--bg);box-sizing:content-box}
.user{display:flex;align-items:center;gap:8px;padding:0 4px;font-weight:500;font-size:13.5px;color:#d9e0ea}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#f2b28a,#b95f86);color:#2b1220;font-weight:700;font-size:13px;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.user .ic{font-size:14px;color:var(--muted)}
.pop{position:absolute;top:48px;right:0;width:300px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.pop p{padding:9px 10px;border-radius:8px;font-size:13px;color:#cdd6e2}
.pop p+p{border-top:1px solid var(--line)}
.pop b{color:#fff;font-weight:600}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn.small{height:34px;padding:0 13px;font-size:13px}
.btn.primary{background:var(--accent);color:#031416}
.btn.primary:hover{background:#22b8b8}
.btn.ghost{border:1px solid rgba(255,255,255,.2);background:rgba(10,15,22,.4);color:#f0f4fa}
.btn.ghost:hover{border-color:rgba(255,255,255,.38);background:rgba(10,15,22,.65)}
.btn.ghost[aria-pressed=true]{border-color:rgba(79,214,214,.6);color:var(--accent-hi)}
.btn.teal-line{border:1px solid rgba(79,214,214,.5);color:var(--accent-hi)}
.btn.teal-line:hover{background:rgba(24,161,161,.14)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:184px minmax(0,1fr) 216px;grid-template-areas:"side main rail";align-items:start}
.side{grid-area:side;position:sticky;top:60px;height:calc(100vh - 60px);display:flex;flex-direction:column;padding:18px 12px;background:var(--sidebar);border-right:1px solid var(--line)}
.side-nav{display:grid;gap:4px}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 14px;border-radius:9px;border:1px solid transparent;color:#b4bfce;font-weight:500}
.side-nav button .ic{font-size:18px}
.side-nav button:hover{background:#151b25;color:#fff}
.side-nav button[aria-current=page]{background:rgba(24,161,161,.16);border-color:rgba(79,214,214,.22);color:var(--accent-hi)}
.dev{margin-top:auto}
.dev-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12px;color:#5d6a7d}
.dev-btn:hover{color:#8a96a8;background:#121822}
.ok-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;background:rgba(63,191,138,.14);border:1px solid rgba(63,191,138,.38);color:#7be0b4;font-size:12px;font-weight:600}
.ok-badge i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dev-exit{display:block;margin:6px 0 0 4px;padding:4px 6px;font-size:12px;color:#7e8a9c;text-decoration:underline;text-underline-offset:3px}
.dev-exit:hover{color:#c1cbd9}
.main{grid-area:main;min-width:0;padding:20px 20px 60px}
.main section{scroll-margin-top:76px}
.main section+section{margin-top:26px}
.rail{grid-area:rail;position:sticky;top:60px;height:calc(100vh - 60px);padding:20px 16px 20px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rail .panel{display:flex;flex-direction:column;height:100%;padding:16px 8px 8px 14px}
.rail h2{margin-bottom:10px;font-size:16px;font-weight:700}
.rel-list{display:grid;gap:2px;overflow-y:auto;padding-right:6px}
.rel{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:10px;text-align:left;min-width:0}
.rel:hover{background:var(--surface-2)}
.rel-cover{width:40px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.rel-cover img{width:100%;height:100%;object-fit:cover}
.rel strong{display:block;font-size:13px;font-weight:600;line-height:1.3}
.rel small{color:var(--muted);font-size:11.5px}

/* ---------- Hero ---------- */
.hero{position:relative;display:flex;align-items:center;gap:30px;min-height:214px;padding:22px 48px 38px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(90deg,rgba(8,13,19,.94) 0%,rgba(8,13,19,.62) 50%,rgba(8,13,19,.18) 100%),var(--art) center/cover no-repeat,#0a1615}
.hero-cover{width:114px;aspect-ratio:2/3;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
.hero-cover img{width:100%;height:100%;object-fit:cover}
.hero-copy{min-width:0}
.kicker{font-size:14px;color:#dbe3ee;margin-bottom:2px}
.hero h1{font-size:clamp(26px,3.3vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.02em;color:#fff;text-wrap:balance}
.hero .sub{margin:6px 0 16px;font-size:14px;color:#d0d9e6}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
.dots button{width:22px;height:14px;display:grid;place-items:center}
.dots button::before{content:"";width:16px;height:3px;border-radius:3px;background:rgba(255,255,255,.3)}
.dots button[aria-current=true]::before{background:var(--accent-hi)}

/* ---------- Section heads ---------- */
.sec-h{font-size:16px;font-weight:700;letter-spacing:-.005em}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-tools{display:flex;align-items:center;gap:8px}
.sec-tools .link{padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--accent-hi);border:1px solid rgba(79,214,214,.3)}
.sec-tools .link:hover{background:rgba(24,161,161,.12)}
.arrow{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:#c1cbd9}
.arrow:hover{background:var(--surface-2);color:#fff}
#continue .sec-h,#genres .sec-h{margin-bottom:12px}

/* ---------- Continue reading ---------- */
.cont-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cont{display:flex;align-items:center;gap:12px;padding:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cont:hover{border-color:rgba(79,214,214,.35)}
.cont-cover{width:44px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.cont-cover img{width:100%;height:100%;object-fit:cover}
.cont-body{min-width:0;flex:1;display:grid;gap:2px}
.cont-body strong{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-body small{color:var(--muted);font-size:11.5px}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.bar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent-hi)}
.bar-row b{font-size:11px;font-weight:500;color:#c3ccd9}

/* ---------- Genres ---------- */
.genre-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pill{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 10px;border-radius:12px;background:var(--bg-t);border:1px solid var(--bd);color:var(--c);font-weight:500;font-size:14px}
.pill .ic{font-size:18px}
.pill:hover{filter:brightness(1.18)}
.pill[aria-pressed=true]{box-shadow:0 0 0 2px var(--c) inset}

/* ---------- Popular ---------- */
.track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,calc((100% - 48px)/5));gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 0 6px}
.track::-webkit-scrollbar{display:none}
.track.wrap{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));overflow:visible}
.card{scroll-snap-align:start;min-width:0;padding:8px 8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.card:hover{border-color:rgba(79,214,214,.38)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0b1118}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h3{margin:9px 2px 4px;font-size:13.5px;font-weight:600;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:12px;margin:0 2px 8px;font-size:12px;color:#c6cfdc}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .rate .ic{color:#f5c542}
.meta .views{color:var(--muted)}
.meta .new{padding:1px 8px;border-radius:999px;background:rgba(79,214,214,.14);color:var(--accent-hi);font-weight:600;font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px}
.tags span{padding:2px 9px;border-radius:999px;background:#252e3d;color:#a9b4c4;font-size:11px}
.del{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:rgba(8,12,18,.88);color:#ffb0b0;font-size:11px;font-weight:600;justify-content:center}
.del .ic{font-size:13px}
.del.armed{background:#7a2530;color:#fff}
.saved-mark{position:absolute;top:6px;left:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:rgba(8,12,18,.85);color:var(--accent-hi);font-size:13px}
.saved-mark .ic{fill:currentColor}
.empty{grid-column:1/-1;padding:28px 20px;border:1px dashed rgba(255,255,255,.14);border-radius:12px;color:var(--muted);text-align:center}

/* ---------- Reader ---------- */
.reader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#0b0f15;animation:rd .18s ease-out}
@keyframes rd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.r-bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0e131b}
.r-title{min-width:0;flex:1}
.r-title strong{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title span{font-size:12.5px;color:var(--muted)}
.r-bar select{height:34px;max-width:200px;padding:0 10px;border-radius:9px;background:#141a24;border:1px solid var(--line);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#141a24}
.seg button{display:grid;place-items:center;width:36px;height:34px;color:#8a96a8;font-family:var(--read)}
.seg button:hover{color:#fff}
.seg button[aria-pressed=true]{background:rgba(24,161,161,.22);color:var(--accent-hi)}
.r-progress{height:3px;background:rgba(255,255,255,.06)}
.r-progress i{display:block;height:100%;width:0;background:var(--accent-hi)}
.r-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.r-page{max-width:calc(var(--read-size)*36);margin:0 auto;padding:52px 24px 110px;font:400 var(--read-size)/1.8 var(--read);color:#d3d9e4}
.r-kicker{font:500 13px var(--ui);color:var(--accent-hi);margin-bottom:8px}
.r-page h2{font-size:1.55em;line-height:1.25;font-weight:600;letter-spacing:-.01em;color:#fff;margin-bottom:.7em;text-wrap:balance}
.r-sum{margin-bottom:1.8em;padding-left:16px;border-left:2px solid rgba(79,214,214,.4);font-style:italic;font-size:.94em;color:#98a5b8}
.r-page p{margin:0 0 1.2em;text-wrap:pretty}
.r-page .r-kicker,.r-page .r-sum{text-wrap:wrap}
.r-nav{display:flex;justify-content:space-between;gap:12px;margin-top:3.2em;font-family:var(--ui)}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:rgba(4,7,11,.72);backdrop-filter:blur(4px);overflow-y:auto;animation:fd .15s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
.modal{width:min(440px,100%);max-height:92vh;overflow-y:auto;padding:24px;border-radius:16px;background:var(--surface);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal.wide{width:min(640px,100%)}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.modal .lede{margin:4px 0 18px;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#cdd6e2}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;background:#121822;border:1px solid rgba(255,255,255,.12)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:rgba(79,214,214,.6);box-shadow:0 0 0 3px rgba(24,161,161,.2)}
.field [aria-invalid=true]{border-color:rgba(255,138,138,.7)}
.field .hint{font-size:12px;color:var(--muted)}
.err{font-size:12.5px;color:var(--danger)}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.author-list{display:grid;gap:6px;margin-top:6px}
.author-list button{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:10px;background:#121822;border:1px solid var(--line);text-align:left}
.author-list button:hover{border-color:rgba(79,214,214,.4)}
.author-list small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;z-index:200;transform:translateX(-50%);max-width:min(92vw,460px);padding:11px 16px;border-radius:11px;background:#111b26;border:1px solid rgba(79,214,214,.35);color:#e7f7f7;font-size:13.5px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:fd .18s ease-out}
.toast.bad{border-color:rgba(255,138,138,.5)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:184px minmax(0,1fr);grid-template-areas:"side main" "side rail"}
  .rail{position:static;height:auto;padding:0 20px 40px}
  .rail .panel{height:auto}
  .rel-list{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));overflow:visible}
  .genre-row{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .top{flex-wrap:wrap;padding:8px 14px}
  .brand{width:auto;padding-left:0}
  .nav{order:5;width:100%;height:42px;overflow-x:auto}
  .nav button{white-space:nowrap}
  .search{width:auto;flex:1;min-width:120px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "rail" "side"}
  .side{position:static;height:auto;padding:12px 16px 28px;border-right:0;border-top:1px solid var(--line)}
  .side-nav{display:none}
  .main{padding:16px 14px 30px}
  .rail{padding:0 14px 20px}
  .user span{display:none}
  .hero{padding:20px 20px 38px;gap:18px}
}
@media (max-width:640px){
  .cont-row{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start;padding-bottom:40px}
  .hero-cover{width:92px}
  .upload-label{display:none}
  .two{grid-template-columns:1fr}
  .r-bar{flex-wrap:wrap}
  .r-title{flex-basis:100%}
  .r-page{padding:34px 18px 90px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="page">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 34" fill="none" stroke="#5fe3e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12c5-2.6 10-2.2 16 2 6-4.2 11-4.6 16-2v16c-5-2.6-10-2.2-16 2-6-4.2-11-4.6-16-2z"/><path d="M20 14v16"/><path d="M20 3v5M17.5 5.5h5" stroke-width="1.8"/><path d="M31 2v3M29.5 3.5h3" stroke-width="1.6"/><path d="M9 4v3M7.5 5.5h3" stroke-width="1.6"/></svg>
      <span>StoryWeave</span>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-nav="home">Home</button>
      <button data-nav="genres">Genres</button>
      <button data-nav="authors">Authors</button>
      <button data-nav="shelf">My Bookshelf</button>
      <button data-nav="community">Community</button>
    </nav>
    <div class="grow"></div>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Search stories, genres, authors</label>
      <input id="q" type="search" placeholder="Search stories, genres, authors..." autocomplete="off">
    </div>
    <div class="actions">
      <button class="btn teal-line small" id="uploadBtn" data-act="upload" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="upload-label">Upload Story</span><span class="sr upload-sr">Upload Story</span>
      </button>
      <button class="icon-btn dot" id="bellBtn" data-act="bell" aria-label="Notifications" aria-expanded="false">

function setInert(on) { const p = $('#page'); if ('inert' in p) p.inert = on; }
function openModal(html, focusSel) {
  lastFocus = document.activeElement;
  $('#modalRoot').innerHTML = `<div class="overlay" data-act="overlay">${html}</div>`;
  setInert(true); document.body.classList.add('lock');
  const f = $(focusSel, $('#modalRoot')); if (f) f.focus();
}
function closeModal() {
  $('#modalRoot').innerHTML = '';
  if (!state.reader) { setInert(false); document.body.classList.remove('lock'); }
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
const modalOpen = () => !!$('#modalRoot').firstElementChild;

function openPassword() {
  openModal(`<form class="modal" data-form="pw" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate>
    <h2 id="mt">Developer Mode</h2><p class="lede">Enter the editor password to upload stories.</p>
    <div class="field"><label for="pw">Password</label><input id="pw" name="pw" type="password" autocomplete="off"><p class="err" data-err role="alert" hidden></p></div>
    <div class="row"><button type="button" class="btn ghost small" data-act="close-modal">Cancel</button><button type="submit" class="btn primary small">Unlock</button></div></form>`, '#pw');
}
async function submitPassword(form) {
  const pwEl = form.elements.pw, btn = $('button[type=submit]', form), err = $('[data-err]', form);
  const fail = msg => { err.textContent = msg; err.hidden = false; pwEl.setAttribute('aria-invalid', 'true'); btn.disabled = false; pwEl.focus(); pwEl.select(); };
  if (!pwEl.value) return fail('Enter the password.');
  btn.disabled = true; err.hidden = true;
  try {
    const r = await fetch('/api/auth', { method: 'POST', headers: { 'x-dev-password': pwEl.value } });
    if (r.status === 401) return fail('That password isn\u2019t right. Check it and try again.');
    if (!r.ok) return fail('The server had a problem. Try again in a moment.');
    state.dev = true; state.devPw = pwEl.value;
    closeModal(); renderDev(); renderPopular(); toast('Developer Mode Active. You can now upload stories.');
    migrateLocal();
  } catch (e) { fail('Can\u2019t reach the server. Check your connection and try again.'); }
}
function openUpload() {
  if (!state.dev) return;
  const genres = ['Fantasy', 'Sci-Fi', 'Mystery', 'Romance', 'Adventure', 'Historical', 'Drama', 'Horror', 'Thriller'];
  openModal(`<form class="modal wide" data-form="upload" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate>
    <h2 id="mt">Upload a story</h2><p class="lede">It appears in Popular Stories This Week for every visitor.</p>
    <div class="two">
      <div class="field"><label for="f-title">Title</label><input id="f-title" name="title" maxlength="90" autocomplete="off"><p class="err" data-err="title" hidden></p></div>
      <div class="field"><label for="f-author">Author</label><input id="f-author" name="author" maxlength="70" autocomplete="off"><p class="err" data-err="author" hidden></p></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-genre">Genre</label><input id="f-genre" name="genre" list="genreList" maxlength="30" autocomplete="off"><datalist id="genreList">${genres.map(g => `<option value="${g}">`).join('')}</datalist><p class="err" data-err="genre" hidden></p></div>
      <div class="field"><label for="f-cover">Cover image URL <span style="color:var(--muted);font-weight:400">(optional)</span></label><input id="f-cover" name="cover" type="url" placeholder="https://" autocomplete="off"><p class="err" data-err="cover" hidden></p></div>
    </div>
    <div class="field"><label for="f-summary">Summary</label><textarea id="f-summary" name="summary" rows="3" maxlength="400"></textarea><p class="err" data-err="summary" hidden></p></div>
    <div class="field"><label for="f-text">Full text / chapter content</label><textarea id="f-text" name="text" rows="9"></textarea>
      <p class="hint">To split into chapters, put a line containing only --- between them. Start a chapter with a line like “Chapter 2: Title” to name it.</p><p class="err" data-err="text" hidden></p></div>
    <p class="err" data-err="form" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost small" data-act="close-modal">Cancel</button><button type="submit" class="btn primary small">Publish story</button></div></form>`, '#f-title');
}
function parseChapters(raw) {
  return raw.split(/^[ \t]*---[ \t]*$/m).map(p => p.trim()).filter(Boolean).map((part, i) => {
    const lines = part.split('\n'), first = lines[0].trim();
    if (lines.length > 1 && (/^chapter\b/i.test(first) || /^#{1,3}\s+/.test(first)) && first.length < 90) {
      return { title: first.replace(/^#{1,3}\s+/, '').replace(/^chapter\s*\d*\s*[:.\-–—]?\s*/i, '').trim() || `Chapter ${i + 1}`, text: lines.slice(1).join('\n').trim() };
    }
    return { title: `Chapter ${i + 1}`, text: part };
  }).filter(c => c.text);
}
async function submitUpload(form) {
  if (!state.dev) { closeModal(); return; }
  const E = form.elements, v = { title: E.title.value.trim(), author: E.author.value.trim(), genre: E.genre.value.trim(), cover: E.cover.value.trim(), summary: E.summary.value.trim(), text: E.text.value.trim() };
  const errs = {};
  if (!v.title) errs.title = 'Add a title.';
  if (!v.author) errs.author = 'Add the author\u2019s name.';
  if (!v.genre) errs.genre = 'Choose or type a genre.';
  if (v.cover && !/^https?:\/\//i.test(v.cover)) errs.cover = 'Use a link that starts with http:// or https://.';
  if (!v.summary) errs.summary = 'Add a short summary.';
  if (!v.text) errs.text = 'Paste the story text.';
  $$('[data-err]', form).forEach(e => {
    const k = e.dataset.err; if (k === 'form') { e.hidden = true; return; }
    e.hidden = !errs[k]; e.textContent = errs[k] || ''; const inp = form.elements[k]; if (inp) inp.setAttribute('aria-invalid', errs[k] ? 'true' : 'false');
  });
  const bad = Object.keys(errs)[0];
  if (bad) { form.elements[bad].focus(); return; }
  const btn = $('button[type=submit]', form), formErr = $('[data-err=form]', form);
  btn.disabled = true; btn.textContent = 'Publishing\u2026';
  const reset = msg => { btn.disabled = false; btn.textContent = 'Publish story'; formErr.textContent = msg; formErr.hidden = false; };
  try {
    const r = await fetch('/api/stories', { method: 'POST', headers: { 'content-type': 'application/json', 'x-dev-password': state.devPw },
      body: JSON.stringify({ title: v.title, author: v.author, genre: v.genre, cover: v.cover, summary: v.summary, chapters: parseChapters(v.text) }) });
    if (r.status === 401) { state.dev = false; state.devPw = ''; closeModal(); renderDev(); renderPopular(); return toast('The server rejected the password. Unlock Developer Mode again.', true); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) return reset(data.error || 'The server couldn\u2019t save the story. Try again.');
    const [story] = cleanUploaded([data.story]);
    state.uploaded.unshift(story);
    state.filter = { type: 'all' }; state.nav = 'home'; $('#q').value = '';
    closeModal(); renderAll();
    const track = $('#track'); if (track) track.scrollLeft = 0;
    toast(`\u201c${story.title}\u201d is live for every visitor.`);
  } catch (e) { reset('Can\u2019t reach the server. Check your connection and try again.'); }
}
async function deleteStory(id) {
  try {
    const r = await fetch('/api/stories?id=' + encodeURIComponent(id), { method: 'DELETE', headers: { 'x-dev-password': state.devPw } });
    if (!r.ok && r.status !== 404) throw new Error('delete failed');
  } catch (e) { return toast('Couldn\u2019t remove the story. Try again.', true); }
  state.uploaded = state.uploaded.filter(s => s.id !== id); state.shelf.delete(id); delete state.progress[id];
  store.set('sw_shelf', [...state.shelf]); store.set('sw_progress', state.progress);
  renderAll(); toast('Story removed.');
}
function openAuthors() {
  const map = {}; allStories().forEach(s => { (map[s.author] = map[s.author] || []).push(s); });
  const names = Object.keys(map).sort((a, b) => a.localeCompare(b));
  openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Authors</h2><p class="lede">Pick an author to see their stories.</p>
    <div class="author-list">${names.map(n => `<button data-author="${esc(n)}"><span>${esc(n)}</span><small>${map[n].length} ${map[n].length === 1 ? 'story' : 'stories'}</small></button>`).join('')}</div>
    <div class="row"><button class="btn ghost small" data-act="close-modal">Close</button></div></div>`, '.author-list button');
}

/* =====================================================================
   Reader
   ===================================================================== */
let saveTimer;
function persistProgress() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('sw_progress', state.progress), 300); }
function recordProgress(frac) {
  const rd = state.reader; if (!rd) return;
  const s = byId(rd.id), n = s.chapters.length;
  const pct = Math.max(1, Math.min(100, Math.round(((rd.ch + frac) / n) * 100)));
  state.progress[rd.id] = { pct, chapter: rd.ch + 1, t: Date.now() };
  $('#rBar').style.width = pct + '%';
  persistProgress();
}
function applySize() {
  $('#reader').style.setProperty('--read-size', SIZES[state.size] + 'px');
  $$('.seg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.size === state.size)));
}
function openReader(id, opts = {}) {
  const s = byId(id); if (!s) return;
  let ch = 0;
  if (opts.resume && p_ok(state.progress[id])) ch = Math.min(Math.max(state.progress[id].chapter - 1, 0), s.chapters.length - 1);
  lastFocus = document.activeElement;
  state.reader = { id, ch };
  $('#reader').hidden = false; setInert(true); document.body.classList.add('lock');
  applySize(); renderReader(true);
  $('#rClose').focus();
}
function renderReader(fresh) {
  const { id, ch } = state.reader, s = byId(id), c = s.chapters[ch], n = s.chapters.length;
  $('#rTitle').textContent = s.title; $('#rAuthor').textContent = 'by ' + s.author;
  $('#rChapters').innerHTML = s.chapters.map((x, i) => `<option value="${i}" ${i === ch ? 'selected' : ''}>${i + 1}. ${esc(x.title)}</option>`).join('');
  $('#rChapters').hidden = n < 2;
  const paras = c.text.split(/\n{2,}/).map(p => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
  $('#rPage').innerHTML = `<p class="r-kicker">Chapter ${ch + 1} of ${n}</p><h2>${esc(c.title)}</h2>${ch === 0 && s.summary ? `<p class="r-sum">${esc(s.summary)}</p>` : ''}${paras}
    <div class="r-nav"><button class="btn ghost" data-act="prev-ch" ${ch === 0 ? 'disabled' : ''}>Previous chapter</button><button class="btn primary" data-act="next-ch">${ch < n - 1 ? 'Next chapter' : 'Finish reading'}</button></div>`;
  updateReaderShelf();
  $('#rScroll').scrollTop = 0;
  if (!fresh) recordProgress(0); else $('#rBar').style.width = (state.progress[id] && p_ok(state.progress[id]) ? state.progress[id].pct : 0) + '%';
}
function updateReaderShelf() {
  if (!state.reader) return;
  const id = state.reader.id, saved = state.shelf.has(id), b = $('#rShelf');
  b.dataset.shelf = id; b.setAttribute('aria-pressed', String(saved));
  b.innerHTML = `${ic(saved ? 'check' : 'bookmark')}${saved ? 'On Bookshelf' : 'Add to Bookshelf'}`;
}
function closeReader() {
  if (!state.reader) return;
  clearTimeout(saveTimer); store.set('sw_progress', state.progress);
  state.reader = null; $('#reader').hidden = true;
  if (!modalOpen()) { setInert(false); document.body.classList.remove('lock'); }
  renderContinue();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
function gotoChapter(i) {
  const s = byId(state.reader.id); if (i < 0 || i >= s.chapters.length) return;
  state.reader.ch = i; renderReader(false);
}
function toggleShelf(id) {
  if (state.shelf.has(id)) { state.shelf.delete(id); toast('Removed from your bookshelf.'); } else { state.shelf.add(id); toast('Added to your bookshelf.'); }
  store.set('sw_shelf', [...state.shelf]);
  renderHero(); renderPopular(); updateReaderShelf();
}

/* =====================================================================
   Navigation & filters
   ===================================================================== */
function scrollToEl(sel) { const el = $(sel); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }
function setFilter(f, nav) {
  state.filter = f; if (nav) state.nav = nav;
  if (f.type !== 'search') $('#q').value = '';
  renderGenres(); renderPopular(); renderNav();
}
function go(where) {
  if (where === 'home') { setFilter({ type: 'all' }, 'home'); window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); }
  else if (where === 'genres') { state.nav = 'genres'; renderNav(); scrollToEl('#genres'); }
  else if (where === 'authors') openAuthors();
  else if (where === 'shelf') { setFilter({ type: 'shelf' }, 'shelf'); scrollToEl('#popular'); }
  else if (where === 'community') toast('Community is coming soon.');
}

/* =====================================================================
   Events
   ===================================================================== */
const SEL = '[data-open],[data-resume],[data-shelf],[data-genre],[data-del],[data-nav],[data-act],[data-hero],[data-size],[data-author]';
document.addEventListener('click', e => {
  const pop = $('#bellPop');
  if (!pop.hidden && !e.target.closest('#bellPop,#bellBtn')) { pop.hidden = true; $('#bellBtn').setAttribute('aria-expanded', 'false'); }
  const el = e.target.closest(SEL); if (!el) return;
  const d = el.dataset;
  if (d.act === 'overlay') { if (e.target === el) closeModal(); return; }
  if (d.del) {
    if (el.classList.contains('armed')) deleteStory(d.del);
    else { el.classList.add('armed'); el.innerHTML = 'Remove?'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.innerHTML = ic('x'); } }, 3000); }
    return;
  }
  if (d.resume) return openReader(d.resume, { resume: true });
  if (d.open) return openReader(d.open);
  if (d.shelf) return toggleShelf(d.shelf);
  if (d.genre) { const same = state.filter.type === 'genre' && state.filter.value.toLowerCase() === d.genre.toLowerCase(); return same ? setFilter({ type: 'all' }, 'home') : setFilter({ type: 'genre', value: d.genre }, 'genres'); }
  if (d.author) { closeModal(); setFilter({ type: 'author', value: d.author }, 'authors'); scrollToEl('#popular'); return; }
  if (d.nav) return go(d.nav);
  if (d.hero) { state.hero = +d.hero; return renderHero(); }
  if (d.size) { state.size = +d.size; store.set('sw_size', state.size); return applySize(); }
  switch (d.act) {
    case 'dev': return openPassword();
    case 'exit-dev': state.dev = false; state.devPw = ''; renderDev(); renderPopular(); return toast('Developer Mode off.');
    case 'upload': return openUpload();
    case 'close-modal': return closeModal();
    case 'close-reader': return closeReader();
    case 'prev-ch': return gotoChapter(state.reader.ch - 1);
    case 'next-ch': {
      const s = byId(state.reader.id);
      if (state.reader.ch < s.chapters.length - 1) return gotoChapter(state.reader.ch + 1);
      state.progress[s.id] = { pct: 100, chapter: s.chapters.length, t: Date.now() }; return closeReader();
    }
    case 'clear-filter': return setFilter({ type: 'all' }, 'home');
    case 'scroll-prev': case 'scroll-next': {
      const t = $('#track'); if (t) t.scrollBy({ left: (d.act === 'scroll-next' ? 1 : -1) * t.clientWidth * .8, behavior: reduceMotion() ? 'auto' : 'smooth' }); return;
    }
    case 'bell': { const open = pop.hidden; pop.hidden = !open; el.setAttribute('aria-expanded', String(open)); el.classList.remove('dot'); return; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalOpen()) return closeModal();
    if (state.reader) return closeReader();
    const pop = $('#bellPop'); if (!pop.hidden) { pop.hidden = true; $('#bellBtn').focus(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')) { e.preventDefault(); openReader(e.target.dataset.open); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'pw') submitPassword(f); else if (f.dataset.form === 'upload') submitUpload(f);
});
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim();
  state.filter = v ? { type: 'search', value: v } : { type: 'all' };
  if (v) state.nav = 'home';
  renderGenres(); renderPopular(); renderNav();
});
$('#rChapters').addEventListener('change', e => gotoChapter(+e.target.value));
$('#rScroll').addEventListener('scroll', () => {
  const el = $('#rScroll'), max = el.scrollHeight - el.clientHeight;
  recordProgress(max > 0 ? el.scrollTop / max : 1);
}, { passive: true });

/* =====================================================================
   Server sync: stories live on the server, shared by every visitor
   ===================================================================== */
let lastLoad = 0;
async function loadStories() {
  try {
    const r = await fetch('/api/stories', { cache: 'no-store' });
    if (!r.ok) return;
    const next = cleanUploaded((await r.json()).stories);
    lastLoad = Date.now();
    if (next.map(s => s.id).join() === state.uploaded.map(s => s.id).join()) return;
    state.uploaded = next;
    renderContinue(); renderGenres(); renderPopular(); renderRail();
  } catch (e) { /* offline or API not deployed: built-in stories still work */ }
}
// One-time move of stories saved by the older browser-only version.
async function migrateLocal() {
  let remaining = cleanUploaded(store.get('sw_uploaded', []));
  if (!remaining.length) return;
  let done = 0;
  for (const s of [...remaining].reverse()) {
    try {
      const r = await fetch('/api/stories', { method: 'POST', headers: { 'content-type': 'application/json', 'x-dev-password': state.devPw },
        body: JSON.stringify({ title: s.title, author: s.author, genre: s.genre, cover: s.cover, summary: s.summary, chapters: s.chapters }) });
      if (!r.ok) break;
      const [n] = cleanUploaded([(await r.json()).story]); state.uploaded.unshift(n); done++;
      remaining = remaining.filter(x => x.id !== s.id); store.set('sw_uploaded', remaining);
    } catch (e) { break; }
  }
  if (!remaining.length) { try { localStorage.removeItem('sw_uploaded'); } catch (e) {} }
  if (done) { renderAll(); toast(`Moved ${done} ${done === 1 ? 'story' : 'stories'} from this browser to the server.`); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastLoad > 30000) loadStories(); });

renderAll();
loadStories();
})();
</script>
